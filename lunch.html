        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --accent: #f43f5e;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--primary);
        }

        p.subtitle {
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .dashboard {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .stat-box h3 {
            margin: 0;
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .stat-box span {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .lyrics-display {
            font-size: 2rem;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090d16;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            letter-spacing: 1px;
            border: 2px solid #334155;
            transition: all 0.2s ease;
        }

        button {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:hover {
            background-color: #7dd3fc;
            transform: translateY(-2px);
        }

        .hidden {
            display: none;
        }
    </style></head><body>

        let currentSong = null;
        let startTime = 0;
        let score = 0;
        let animationFrameId = null;
        let audioCtx = null;
        let micStream = null;
        let analyser = null;
        let dataArray = null;
        let playedNotes = new Set();

        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const songSelect = document.getElementById('song-select');
        const lyricsBox = document.getElementById('lyrics-box');
        const scoreVal = document.getElementById('score-val');
        const pitchVal = document.getElementById('pitch-val');

        startBtn.addEventListener('click', startSong);
        stopBtn.addEventListener('click', stopSong);

        async function startSong() {
            const selectedKey = songSelect.value;
            currentSong = songs[selectedKey];

            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');

            score = 0;
            scoreVal.innerText = score;
            startTime = Date.now();
            playedNotes.clear();

            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                const source = audioCtx.createMediaStreamSource(micStream);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            } catch (err) {
                console.log("Mic access denied or unavailable. Running in visual-only mode.");
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            gameLoop();
        }

        function playMelody(notes) {
            if (!audioCtx) return;
            notes.forEach((freq, index) => {
                let noteTime = audioCtx.currentTime + (index * 0.2);
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, noteTime);
                
                gain.gain.setValueAtTime(0.1, noteTime);
                gain.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.18);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(noteTime);
                osc.stop(noteTime + 0.2);
            });
        }

        function gameLoop() {
            const elapsed = Date.now() - startTime;

            let activeLyric = "Get Ready...";
            for (let i = currentSong.notes.length - 1; i >= 0; i--) {
                let noteObj = currentSong.notes[i];
                if (elapsed >= noteObj.time) {
                    activeLyric = noteObj.text;
                    
                    if (!playedNotes.has(i)) {
                        playedNotes.add(i);
                        playMelody(noteObj.melody);
                    }
                    break;
                }
            }
            lyricsBox.innerText = activeLyric;

            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = dataArray.reduce((a, b) => a + b, 0);
                let average = sum / dataArray.length;

                if (average > 10) {
                    pitchVal.innerText = "Good! 🎤";
                    pitchVal.style.color = "#4ade80";
                    score += 5;
                } else {
                    pitchVal.innerText = "Sing Up!";
                    pitchVal.style.color = "#f43f5e";
                }
                scoreVal.innerText = score;
            } else {
                pitchVal.innerText = "No Mic";
                score += 2;
                scoreVal.innerText = score;
            }

            if (elapsed < currentSong.duration) {
                animationFrameId = requestAnimationFrame(gameLoop);
            } else {
                stopSong();
                lyricsBox.innerText = "🎉 Song Finished! Final Score: " + score;
            }
        }

        function stopSong() {
            cancelAnimationFrame(animationFrameId);
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
                micStream = null;
            }
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
            gameScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        }
